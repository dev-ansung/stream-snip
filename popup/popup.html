<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StegoClip - HLS Video Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>🎬 StegoClip</h1>
    <span id="streamCount" class="badge">0 streams</span>
  </header>

  <main>
    <!-- Stream Selector -->
    <section class="section">
      <label for="streamSelect">Select Stream:</label>
      <select id="streamSelect">
        <option value="">Searching for active streams...</option>
      </select>
    </section>

    <!-- Video Preview Section -->
    <section class="section video-section">
      <video id="previewPlayer" controls playsinline></video>
      <div id="videoInfo" class="meta-info">Duration: --:--</div>
    </section>

    <!-- Range Selection Controls -->
    <section class="section range-section">
      <div class="field-row">
        <div class="field-group">
          <label for="startTime">Start Time:</label>
          <div class="input-with-button">
            <input type="text" id="startTime" value="00:00" />
            <button type="button" id="btnSetStart" title="Set to current video playback time">⏱️ Current</button>
          </div>
        </div>

        <div class="field-group">
          <label for="endTime">End Time:</label>
          <div class="input-with-button">
            <input type="text" id="endTime" value="00:00" />
            <button type="button" id="btnSetEnd" title="Set to current video playback time">⏱️ Current</button>
          </div>
        </div>
      </div>

      <div class="toggle-row">
        <label>
          <input type="checkbox" id="fullVideoToggle" /> Download Full Video
        </label>
        <span id="clipDurationText" class="meta-info">Clip: 00:00</span>
      </div>
    </section>

    <!-- Output & Download -->
    <section class="section action-section">
      <label for="filenameInput">Output Filename:</label>
      <input type="text" id="filenameInput" placeholder="video_clip.ts" />

      <button type="button" id="btnDownload" class="primary-btn">⬇️ Download Clip</button>
      <button type="button" id="btnCancel" class="danger-btn" style="display: none;">Cancel</button>

      <!-- Progress Tracking -->
      <div id="progressContainer" style="display: none;">
        <progress id="downloadProgress" value="0" max="100"></progress>
        <div id="progressStatus" class="meta-info">Preparing download...</div>
      </div>
    </section>
  </main>

  <!-- Libraries -->
  <script src="../lib/hls.min.js"></script>
  <script src="../lib/time.js"></script>
  <script src="../lib/stego.js"></script>
  <script src="../lib/stego-loader.js"></script>
  <script src="../lib/parser.js"></script>
  <script src="../lib/downloader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
